name = "quorumAudit"
version = "0.1.0"
defaultTargets = ["QuorumAudit"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "QuorumAudit"
roots = ["QuorumAudit", "Arithmetic", "CertificateChecker", "BaseCertificates", "Compression", "SemanticBounds", "UniversalLowerBound", "InsertionLocal", "InsertionCyclic", "InsertionReads", "InsertionMass", "InsertionComposition", "IndexedRouting", "ConstructiveRouting", "BalancedLowerBound"]

[[lean_lib]]
name = "TwoCrashAudit"
roots = ["TwoCrashOptimal", "TwoCrashFullControls", "TwoCrashBridge"]
